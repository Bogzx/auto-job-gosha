<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOSHA Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e4e7; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #27272a; }
        nav h2 { background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: #a1a1aa; text-decoration: none; margin-left: 1rem; }
        nav a:hover { color: #e4e4e7; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #1a1b23; border: 1px solid #27272a; border-radius: 12px; padding: 1.25rem; }
        .stat-card .label { color: #a1a1aa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
        .stat-card .value.green { color: #22c55e; }
        .stat-card .value.red { color: #ef4444; }
        .stat-card .value.blue { color: #6366f1; }

        h3 { margin-bottom: 1rem; color: #e4e4e7; }

        .job-feed { margin-top: 1rem; }
        .job-card { background: #1a1b23; border: 1px solid #27272a; border-radius: 10px; padding: 1.25rem; margin-bottom: 0.75rem; transition: border-color 0.2s; }
        .job-card:hover { border-color: #6366f1; }
        .job-card h4 { margin-bottom: 0.5rem; }
        .job-card h4 a { color: #8b5cf6; text-decoration: none; }
        .job-card h4 a:hover { text-decoration: underline; }
        .job-meta { display: flex; gap: 1rem; flex-wrap: wrap; color: #a1a1aa; font-size: 0.9rem; }
        .job-meta span { display: inline-flex; align-items: center; gap: 0.25rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #052e16; color: #22c55e; }
        .badge-red { background: #2a0a0a; color: #ef4444; }
        .badge-gray { background: #27272a; color: #a1a1aa; }

        .feedback-btns { margin-top: 0.5rem; }
        .feedback-btns button { padding: 0.3rem 0.75rem; border-radius: 6px; border: 1px solid #27272a; background: #1a1b23; color: #a1a1aa; cursor: pointer; font-size: 0.8rem; margin-right: 0.3rem; }
        .feedback-btns button:hover { border-color: #6366f1; color: #e4e4e7; }
        .feedback-btns button.active-green { background: #052e16; color: #22c55e; border-color: #22c55e; }
        .feedback-btns button.active-red { background: #2a0a0a; color: #ef4444; border-color: #ef4444; }

        #job-list { min-height: 200px; }
        .loading { text-align: center; padding: 2rem; color: #a1a1aa; }
        .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
        .pagination button { padding: 0.4rem 0.8rem; border: 1px solid #27272a; background: #1a1b23; color: #a1a1aa; border-radius: 6px; cursor: pointer; }
        .pagination button:hover { border-color: #6366f1; }
        .pagination button.active { background: #6366f1; color: white; border-color: #6366f1; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <h2>GOSHA</h2>
            <div>
                <span>{{ user.username }}</span>
                <a href="/logout">Logout</a>
            </div>
        </nav>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Active Subscriptions</div>
                <div class="value blue">{{ stats.active_subscriptions }}</div>
            </div>
            <div class="stat-card">
                <div class="label">Jobs Delivered</div>
                <div class="value">{{ stats.total_delivered }}</div>
            </div>
            <div class="stat-card">
                <div class="label">Interested</div>
                <div class="value green">{{ stats.interested }}</div>
            </div>
            <div class="stat-card">
                <div class="label">Not Relevant</div>
                <div class="value red">{{ stats.not_relevant }}</div>
            </div>
        </div>

        <!-- Job Feed -->
        <h3>Recent Jobs</h3>
        <div id="job-list" class="job-feed">
            <div class="loading">Loading jobs...</div>
        </div>
    </div>

    <script>
        let currentPage = 1;

        async function loadJobs(page = 1) {
            currentPage = page;
            const container = document.getElementById('job-list');
            try {
                const resp = await fetch(`/api/jobs?page=${page}&per_page=15`);
                const data = await resp.json();

                if (data.jobs.length === 0) {
                    container.innerHTML = '<div class="loading">No jobs yet. Subscribe via Discord to start receiving matches!</div>';
                    return;
                }

                let html = '';
                for (const job of data.jobs) {
                    const feedbackBadge = job.feedback === 'interested'
                        ? '<span class="badge badge-green">Interested</span>'
                        : job.feedback === 'not_relevant'
                        ? '<span class="badge badge-red">Not Relevant</span>'
                        : '<span class="badge badge-gray">No feedback</span>';

                    const salary = (job.salary_min || job.salary_max)
                        ? `<span>${[job.salary_min, job.salary_max].filter(Boolean).map(v => v.toLocaleString()).join(' - ')}${job.salary_currency ? ' ' + job.salary_currency : ''}</span>`
                        : '';

                    const score = job.score ? `<span>Score: ${(job.score * 100).toFixed(0)}%</span>` : '';

                    html += `
                        <div class="job-card">
                            <h4><a href="${job.url}" target="_blank">${job.title}</a></h4>
                            <div class="job-meta">
                                <span>${job.company}</span>
                                <span>${job.location}</span>
                                <span>${job.source}</span>
                                ${salary}
                                ${score}
                                ${feedbackBadge}
                            </div>
                            ${!job.feedback ? `
                            <div class="feedback-btns">
                                <button onclick="sendFeedback(${job.id}, 'interested', this)">Interested</button>
                                <button onclick="sendFeedback(${job.id}, 'not_relevant', this)">Not Relevant</button>
                            </div>` : ''}
                        </div>`;
                }

                // Pagination
                if (data.pages > 1) {
                    html += '<div class="pagination">';
                    for (let i = 1; i <= data.pages; i++) {
                        html += `<button class="${i === page ? 'active' : ''}" onclick="loadJobs(${i})">${i}</button>`;
                    }
                    html += '</div>';
                }

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div class="loading">Error loading jobs.</div>';
            }
        }

        async function sendFeedback(userJobId, feedback, btn) {
            try {
                const resp = await fetch(`/api/feedback/${userJobId}?feedback=${feedback}`, { method: 'POST' });
                if (resp.ok) {
                    loadJobs(currentPage);
                }
            } catch (err) {
                console.error('Feedback error:', err);
            }
        }

        // Load on page load
        loadJobs();
    </script>
</body>
</html>
