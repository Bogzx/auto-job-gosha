name: CI

on:
  push:
    branches: [main, web-platform]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install "discord.py>=2.3,<3" "sqlalchemy>=2.0,<3" aiosqlite \
            "apscheduler>=3.10,<4" "pandas>=2.0" pysocks python-dotenv numpy \
            fastapi uvicorn jinja2 python-multipart httpx itsdangerous pymupdf \
            asyncpg slowapi pytest pytest-asyncio respx
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
