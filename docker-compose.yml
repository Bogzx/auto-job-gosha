services:
  # ── Discord bot + scheduler + SSH tunnels ──────────────────
  job-bot:
    build: .
    container_name: job-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./keys:/home/app/.ssh:ro
    # Host networking required for SSH tunnel SOCKS5 ports
    network_mode: host

  # ── Admin dashboard (localhost only) ───────────────────────
  admin:
    build: .
    container_name: gosha-admin
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "gosha.web.app:app", "--host", "127.0.0.1", "--port", "8080"]
    # Bind to host localhost only — access via SSH tunnel
    network_mode: host
